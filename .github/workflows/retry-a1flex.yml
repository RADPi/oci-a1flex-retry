name: Retry OCI A1.Flex instance

on:
  schedule:
    # Cada 10 minutos. El script ya no prueba una sola vez y corta: dentro
    # de cada corrida reintenta varias veces con una pausa entre intentos
    # (ver RETRY_DELAY_SECONDS / MAX_RUN_SECONDS en retry_oci_a1flex.py),
    # asi que en los ~4 minutos que dura cada corrida ya hace unos 16
    # intentos. Espaciar las corridas a 10 minutos evita solapar jobs
    # (concurrency de abajo los harian esperar en cola igual) y le da mas
    # margen al rate limiting propio de la API de OCI. Repo publico =
    # minutos de Actions ilimitados, asi que esto no consume cuota.
    - cron: '*/10 * * * *'
  workflow_dispatch: {}

concurrency:
  group: oci-a1flex-retry
  cancel-in-progress: false

jobs:
  retry:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar OCI SDK
        run: pip install --quiet oci

      - name: Intentar crear la instancia
        id: attempt
        env:
          OCI_USER_OCID: ${{ secrets.OCI_USER_OCID }}
          OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
          OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}
          OCI_REGION: ${{ secrets.OCI_REGION }}
          OCI_PRIVATE_KEY: ${{ secrets.OCI_PRIVATE_KEY }}
          OCI_SSH_PUBLIC_KEY: ${{ secrets.OCI_SSH_PUBLIC_KEY }}
          OCI_VCN_NAME: ${{ secrets.OCI_VCN_NAME }}
          OCI_SUBNET_NAME: ${{ secrets.OCI_SUBNET_NAME }}
          OCI_INSTANCE_NAME: ${{ secrets.OCI_INSTANCE_NAME }}
        run: python retry_oci_a1flex.py

      - name: Avisar exito (issue + apagar el workflow)
        if: steps.attempt.outputs.success == 'true' && steps.attempt.outputs.already_existed != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create \
            --title "Instancia ${{ steps.attempt.outputs.instance_name }} creada" \
            --body "Se creo la instancia '${{ steps.attempt.outputs.instance_name }}' (Ampere A1 Flex) exitosamente.

          - Instance OCID: ${{ steps.attempt.outputs.instance_id }}
          - Shape: VM.Standard.A1.Flex (${{ steps.attempt.outputs.shape_desc }})
          - Corrida: ${{ github.run_id }}

          Este workflow se deshabilito automaticamente para no seguir intentando. Podes volver a habilitarlo desde la pestana Actions si hace falta." \
            --repo "${{ github.repository }}"
          gh workflow disable "retry-a1flex.yml" --repo "${{ github.repository }}"
